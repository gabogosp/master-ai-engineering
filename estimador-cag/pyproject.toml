[project]
name = "estimador-cag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.7.0",
    "fastapi>=0.141.1",
    "openai>=3.16.2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

